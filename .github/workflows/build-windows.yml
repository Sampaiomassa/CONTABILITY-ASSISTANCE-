name: Build Windows Installer

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch: {}
  release:
    types: [published, created]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteContabil-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach installer to an existing (manually published) Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.exe

      - name: Create Release from tag and attach installer
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.exe
          name: ${{ format('{0} - Assistente Contábil', github.ref_name) }}
          body: "Instalador gerado e publicado automaticamente pelo GitHub Actions a partir desta tag."
          prerelease: true
